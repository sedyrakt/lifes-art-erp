  # ==========================================================
  # LINUX (Deb only)
  # ==========================================================

  build-linux:

    name: Build Linux DEB Package

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # NODE.JS
      # ------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ------------------------------------------------------
      # GET VERSION
      # ------------------------------------------------------

      - name: Get application version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Application version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # ------------------------------------------------------
      # CACHE ELECTRON
      # ------------------------------------------------------

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.electron
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      # ------------------------------------------------------
      # INSTALL DEPENDENCIES
      # ------------------------------------------------------

      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------
      # REBUILD NATIVE MODULES
      # ------------------------------------------------------

      - name: Rebuild native modules (better-sqlite3)
        run: npx electron-rebuild -f -w better-sqlite3

      # ------------------------------------------------------
      # BUILD & OBFUSCATE FRONTEND (Build:prod)
      # ------------------------------------------------------

      - name: Build secure frontend (Build, Obfuscate, Compile)
        run: npm run build:prod

      # ------------------------------------------------------
      # BUILD LINUX (deb only)
      # ------------------------------------------------------

      - name: Build Linux DEB
        run: npx electron-builder --linux deb --x64 --config electron-builder.yml --publish=never

      # ------------------------------------------------------
      # SHOW OUTPUT
      # ------------------------------------------------------

      - name: Show Linux output
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " LINUX BUILD OUTPUT"
          echo "=========================================="

          if [ ! -d "release" ]; then
            echo "ERROR: release directory does not exist."
            exit 1
          fi

          find release -maxdepth 1 -type f -print

      # ------------------------------------------------------
      # VERIFY DEB (AppImage check n'esorina)
      # ------------------------------------------------------

      - name: Verify DEB
        shell: bash
        run: |
          COUNT=$(find release -maxdepth 1 -type f -name "*.deb" | wc -l)

          echo "DEB count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: DEB package not found."
            exit 1
          fi

      # ------------------------------------------------------
      # RENAME LINUX DEB
      # ------------------------------------------------------

      - name: Rename Linux DEB
        shell: bash
        run: |
          for file in release/*.deb; do
            if [ -f "$file" ]; then
              mv "$file" "release/lifes-art-$VERSION-linux-x64.deb"
            fi
          done

      # ------------------------------------------------------
      # SHOW FINAL ARTIFACTS
      # ------------------------------------------------------

      - name: Show final Linux artifacts
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " FINAL LINUX ARTIFACTS"
          echo "=========================================="
          ls -lah release/

      # ------------------------------------------------------
      # UPLOAD LINUX ARTIFACTS
      # ------------------------------------------------------

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lifes-art-linux-v${{ env.VERSION }}
          path: release/*.deb
          if-no-files-found: error