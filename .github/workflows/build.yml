name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Vite frontend
        run: npm run build

      - name: Build Windows EXE (Portable)
        run: npx electron-builder --win --x64 --publish=never --dir

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifes-art-win64-exe
          path: release/win-unpacked/*.exe

