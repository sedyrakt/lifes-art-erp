# electron-builder.yml

appId: com.lifesart.app
productName: lifes-art
directories:
  output: release
compression: normal
npmRebuild: false             # Atao false mba tsy hanao rebuild indray, efa ataon'ny GitHub Actions

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - .env
  - "!**/*.js.map"             # Manala ny source maps fotsiny.
  - "!**/node_modules/.cache/**"

asar: true
asarUnpack:
  - "**/*.node"
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/sharp/**/*"
  - "electron/ipc/**/*"
  - "electron/preload.cjs"

win:
  target:
    - portable                # Mamorona Portable EXE (tsindrio indroa fotsiny)
    - nsis                     # ⭐ Ampio ity mba hamorona Installer EXE koa
  icon: public/logo.ico

# ⭐ Configuration ho an'ny Installer (NSIS) 
nsis:
  oneClick: false              # Tsy mipetaka indray mandeha, mamela ny mpampiasa hisafidy
  allowToChangeInstallationDirectory: true  # Mamela ny mpampiasa hanova ny toerana ametrahana

linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: public/logo.png