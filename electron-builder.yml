# electron-builder.yml

appId: com.lifesart.app
productName: lifes-art
directories:
  output: release
compression: normal
npmRebuild: true

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - .env
  - "!**/*.js.map"
  - "!**/node_modules/.cache/**"

extraResources:
  - from: .env
    to: .env

asar: true
asarUnpack:
  - "**/*.node"
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/sharp/**/*"
  - "electron/ipc/**/*"
  - "electron/preload.cjs"

win:
  target:
    - portable
  icon: public/logo.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: public/logo.png