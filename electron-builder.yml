# ============================================================
# LIFE'S ART ERP
# electron-builder.yml
# ⭐ FIX: Mampiasa dist-electron/ fa tsy electron/
# ⭐ FIX: ESRINA NY admin-tools
# ============================================================

appId: com.lifesart.app
productName: lifes-art

directories:
  output: release

compression: normal
npmRebuild: false

# ============================================================
# FILES
# ============================================================

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!**/*.js.map"
  - "!**/node_modules/.cache/**"
  - "!dist-electron/keys/private.pem"
  - "!dist-electron/keys/fingerprint.txt"
  - "!admin-tools/**/*"           # ⭐ FIX: ESRINA NY admin-tools

# ============================================================
# ASAR
# ============================================================

asar: true

# ============================================================
# ASAR UNPACK
# ⭐ FIX: Ilaina ho an'ny native modules
# ============================================================

asarUnpack:
  - "**/*.node"
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/sharp/**/*"

# ============================================================
# WINDOWS
# ============================================================

win:
  target:
    - nsis
  icon: public/logo.ico

# ============================================================
# NSIS
# ============================================================

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# ============================================================
# LINUX
# ============================================================

linux:
  target:
    - deb
  category: Office
  icon: public/logo.png