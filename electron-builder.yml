# ============================================================
# LIFE'S ART ERP
# electron-builder.yml
# ⭐ FIX: ESRINA NY desktopName sy synopsisDesktopName
# ============================================================

appId: com.lifesart.app
productName: lifes-art

directories:
  output: release

compression: normal
npmRebuild: false

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!**/*.js.map"
  - "!**/node_modules/.cache/**"
  - "!dist-electron/keys/private.pem"
  - "!dist-electron/keys/fingerprint.txt"
  - "!admin-tools/**/*"

asar: true

asarUnpack:
  - "**/*.node"
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/sharp/**/*"

win:
  target:
    - nsis
  icon: public/logo.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - deb
  category: Office
  icon: public/logo.png