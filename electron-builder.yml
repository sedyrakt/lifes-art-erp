# electron-builder.yml

appId: com.lifesart.app
productName: lifes-art
directories:
  output: release
compression: normal
npmRebuild: false             # Nohavaozina: Atao false mba tsy hanao rebuild indray, efa ataon'ny GitHub Actions

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - .env
  - "!**/*.js.map"             # Manala ny source maps fotsiny. Raha mampiasa .jsc ianao dia aza esorina fa ampidiro mba ho voaaro ilay code
  - "!**/node_modules/.cache/**"

asar: true
asarUnpack:
  - "**/*.node"
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/sharp/**/*"
  - "electron/ipc/**/*"
  - "electron/preload.cjs"

win:
  target:
    - portable
  icon: public/logo.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: public/logo.png