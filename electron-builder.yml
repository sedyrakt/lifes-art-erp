# electron-builder.yml

appId: com.lifesart.app
productName: lifes-art
directories:
  output: release
compression: normal
npmRebuild: false

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - .env
  - "!**/*.js.map"
  - "!**/node_modules/.cache/**"

asar: true
asarUnpack:
  - "**/*.node"
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/sharp/**/*"
  - "electron/ipc/**/*"
  - "electron/preload.cjs"

win:
  target:
    - nsis                     # ⭐ NSIS Installer ihany (tsy misy portable)
  icon: public/logo.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - deb                      # ⭐ .deb ihany (tsy misy AppImage)
  category: Office
  icon: public/logo.png