appId: com.lifesart.app
productName: lifes-art
directories:
  output: release
compression: maximum
npmRebuild: true

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - .env
  - "!**/*.map"
  - "!**/node_modules/.cache/**"

extraResources:
  - from: .env
    to: .env

asar: true
asarUnpack:
  - "**/*.node"
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/sharp/**/*"
  - "electron/ipc/**/*"
  - "electron/preload.cjs"

win:
  target:
    - portable
    - nsis
  icon: public/logo.ico    # ⭐ Tokony ampiasaina ny .ico ho an'ny Windows

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true